<header class="site-header bg-white border-bottom border-base-lighter" role="banner">
  <div class="grid-container">
    <div class="display-flex flex-align-center flex-justify padding-y-2">
      <!-- Logo -->
      <div class="display-flex flex-align-center">
        <a href="/" title="Federal Program Inventory" class="site-logo display-flex flex-align-center text-no-underline">
          <img
            class="width-6 height-6 radius-md"
            src="/assets/img/omb-logo.png"
            alt="Executive Office of the President, Office of Management and Budget logo"
            width="48"
            height="48"
          >
          <div class="margin-left-2 display-none tablet:display-block">
            <span class="text-primary font-heading-sm tablet:font-heading-md text-bold line-height-heading-2 display-block">
              Federal Program Inventory
            </span>
            <span class="text-base font-sans-3xs text-uppercase text-ls-1 display-block margin-top-neg-05">
              Office of Management and Budget
            </span>
          </div>
          <span class="text-primary font-heading-xs text-bold margin-left-2 display-block tablet:display-none">
            FPI
          </span>
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <button type="button" class="usa-menu-btn display-block tablet-lg:display-none bg-transparent border-0 padding-1 cursor-pointer">
        <svg class="usa-icon text-primary" style="width: 28px; height: 28px;" aria-hidden="true" focusable="false" role="img">
          <use xlink:href="/assets/img/sprite.svg#menu"></use>
        </svg>
        <span class="usa-sr-only">Menu</span>
      </button>

      <!-- Desktop Navigation -->
      <nav role="navigation" class="usa-nav display-none tablet-lg:display-block" aria-label="Primary navigation">
        <ul class="usa-nav__primary usa-accordion display-flex flex-align-center margin-0 padding-0">
          <li class="usa-nav__primary-item margin-right-3">
            <a href="/search" class="nav-link text-base-dark hover:text-primary font-sans-sm text-semibold padding-y-1 text-no-underline display-inline-block">
              Program Search
            </a>
          </li>
          <li class="usa-nav__primary-item margin-right-3">
            <a href="/category" class="nav-link text-base-dark hover:text-primary font-sans-sm text-semibold padding-y-1 text-no-underline display-inline-block">
              Explore by Category
            </a>
          </li>
          <li class="usa-nav__primary-item position-relative">
            <button
              type="button"
              class="usa-accordion__button usa-nav__link text-base-dark hover:text-primary font-sans-sm text-semibold padding-y-1 bg-transparent border-0 cursor-pointer display-flex flex-align-center"
              aria-expanded="false"
              aria-controls="about-nav-section"
            >
              <span>About</span>
              <svg class="usa-icon margin-left-05" style="width: 18px; height: 18px;" aria-hidden="true" focusable="false" role="img">
                <use xlink:href="/assets/img/sprite.svg#expand_more"></use>
              </svg>
            </button>
            <div
              id="about-nav-section"
              class="usa-nav__submenu position-absolute top-full right-0 bg-white radius-md shadow-lg border border-base-lighter padding-2 minw-card-lg z-500"
              hidden
            >
              <ul class="usa-nav__submenu-list padding-0 margin-0">
                <li class="usa-nav__submenu-item">
                  <a href="/about/fpi" class="display-block padding-y-1 padding-x-2 radius-sm text-base-dark hover:text-primary hover:bg-base-lightest font-sans-sm text-no-underline transition-fast">
                    About the FPI
                  </a>
                </li>
                <li class="usa-nav__submenu-item">
                  <a href="/about/background-on-the-fpi" class="display-block padding-y-1 padding-x-2 radius-sm text-base-dark hover:text-primary hover:bg-base-lightest font-sans-sm text-no-underline transition-fast">
                    Background on the FPI
                  </a>
                </li>
                <li class="usa-nav__submenu-item">
                  <a href="/about/about-the-data" class="display-block padding-y-1 padding-x-2 radius-sm text-base-dark hover:text-primary hover:bg-base-lightest font-sans-sm text-no-underline transition-fast">
                    About the Data
                  </a>
                </li>
              </ul>
            </div>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <!-- Mobile Navigation Drawer -->
  <nav role="navigation" class="usa-nav display-none" aria-label="Mobile navigation">
    <button type="button" class="usa-nav__close position-absolute top-2 right-2 bg-transparent border-0 padding-1 cursor-pointer">
      <svg class="usa-icon text-base-dark" style="width: 24px; height: 24px;" aria-hidden="true" focusable="false" role="img">
        <use xlink:href="/assets/img/sprite.svg#close"></use>
      </svg>
      <span class="usa-sr-only">Close</span>
    </button>

    <ul class="usa-nav__primary usa-accordion padding-top-6">
      <li class="usa-nav__primary-item border-bottom border-base-lighter">
        <a href="/search" class="usa-nav__link display-block padding-y-2 padding-x-3 text-base-dark font-sans-md text-no-underline">
          <span>Program Search</span>
        </a>
      </li>
      <li class="usa-nav__primary-item border-bottom border-base-lighter">
        <a href="/category" class="usa-nav__link display-block padding-y-2 padding-x-3 text-base-dark font-sans-md text-no-underline">
          <span>Explore by Category</span>
        </a>
      </li>
      <li class="usa-nav__primary-item">
        <button
          type="button"
          class="usa-accordion__button usa-nav__link width-full display-flex flex-justify flex-align-center padding-y-2 padding-x-3 bg-transparent border-0 text-left cursor-pointer"
          aria-expanded="false"
          aria-controls="mobile-about-section"
        >
          <span class="text-base-dark font-sans-md">About</span>
          <svg class="usa-icon text-base" aria-hidden="true" focusable="false" role="img">
            <use xlink:href="/assets/img/sprite.svg#expand_more"></use>
          </svg>
        </button>
        <div
          id="mobile-about-section"
          class="usa-nav__submenu bg-base-lightest"
          hidden
        >
          <ul class="usa-nav__submenu-list padding-y-1">
            <li class="usa-nav__submenu-item">
              <a href="/about/fpi" class="display-block padding-y-105 padding-x-4 text-base-dark hover:text-primary font-sans-sm text-no-underline">
                About the FPI
              </a>
            </li>
            <li class="usa-nav__submenu-item">
              <a href="/about/background-on-the-fpi" class="display-block padding-y-105 padding-x-4 text-base-dark hover:text-primary font-sans-sm text-no-underline">
                Background on the FPI
              </a>
            </li>
            <li class="usa-nav__submenu-item">
              <a href="/about/about-the-data" class="display-block padding-y-105 padding-x-4 text-base-dark hover:text-primary font-sans-sm text-no-underline">
                About the Data
              </a>
            </li>
          </ul>
        </div>
      </li>
    </ul>
  </nav>
</header>
